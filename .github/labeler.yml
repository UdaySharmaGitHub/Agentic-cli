# ── Auto-applied labels (file-path and branch-name based) ────────────────────
# The PR Labeler action applies these automatically when matching files change.
#
# ── Manual-only labels (not listed here — no file-path signal) ───────────────
# bug, duplicate, enhancement, good first issue, help wanted,
# invalid, question, wontfix  — applied by maintainers during triage.

accessibility:
  - changed-files:
    - any-glob-to-any-file:
      - 'src/tui/**'

agent-ux:
  - changed-files:
    - any-glob-to-any-file:
      - 'src/tui/**'
      - 'src/agent.ts'
      - 'src/prompts.ts'

core:
  - changed-files:
    - any-glob-to-any-file:
      - 'src/agent.ts'
      - 'src/openai.ts'
      - 'src/memory.ts'
      - 'src/config.ts'
      - 'src/prompts.ts'
      - 'src/index.ts'
      - 'src/sessions.ts'
      - 'src/tokens.ts'

dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - 'package.json'
      - 'pnpm-lock.yaml'

documentation:
  - changed-files:
    - any-glob-to-any-file:
      - 'docs/**'
      - '*.md'

infrastructure:
  - changed-files:
    - any-glob-to-any-file: '.github/**'

migration:
  - head-branch:
    - '^migration/'
    - '^migrate/'
    - '^refactor/migration'

runbook:
  - changed-files:
    - any-glob-to-any-file:
      - 'src/runbook.ts'
      - 'src/replay.ts'

safety:
  - changed-files:
    - any-glob-to-any-file: 'src/safety.ts'

testing:
  - changed-files:
    - any-glob-to-any-file: 'tests/**'

tools:
  - changed-files:
    - any-glob-to-any-file: 'src/tools/**'

ui:
  - changed-files:
    - any-glob-to-any-file:
      - 'src/tui/**'
      - 'src/ui.ts'
